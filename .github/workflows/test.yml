name: Run Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker test image and run tests
        run: |
          docker build -t react-test -f Dockerfile.dev .
          docker run -e CI=true react-test npm test
